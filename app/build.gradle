plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ghostlay.demo'
    compileSdk 33

    defaultConfig {
        applicationId 'dev.ghostlay.demo'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No third-party dependencies on purpose: the hidden-API bypass is implemented
// with plain reflection in SkipCapture.java, so the project builds offline.
